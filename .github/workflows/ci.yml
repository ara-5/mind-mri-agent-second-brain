name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18/20 are off the matrix — the floor is now 22.5
        # (sdk/embeddings.js uses node:sqlite, built in starting there);
        # 24.x is the other actively supported line.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pull the sandbox image so the Docker tests run for real
        run: docker pull -q node:22-alpine
      - name: Run test suite (zero dependencies — no install step needed)
        run: npm test
      - name: Build the Docker image and speak MCP to it
        if: matrix.node-version == '24.x'
        run: |
          docker build -t second-brain-ci .
          node scripts/docker-smoke.mjs second-brain-ci
      - name: Build (syntax-check every source file)
        run: npm run build
